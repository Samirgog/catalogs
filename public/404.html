<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?p=/one/two&q=a=b~and~c=d#qwe
      var path = location.pathname.slice(1);
      var query = location.search.slice(1);
      var hash = location.hash.slice(1);
      
      // Convert query string to use ~and~ instead of &
      query = query.replace(/&/g, '~and~');
      
      // Build new URL
      var newUrl = '/' + (path ? '?p=/' + path : '') + (query ? '&' + query : '') + (hash ? '#' + hash : '');
      
      // Redirect to new URL
      window.history.replaceState(null, null, newUrl);
      
      // Reload to let React Router handle the route
      window.location.reload();
    </script>
  </head>
  <body>
    <!-- This page will be overwritten by the build -->
  </body>
</html>
